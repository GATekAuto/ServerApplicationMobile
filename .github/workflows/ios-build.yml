name: Build iOS

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: Select the iOS artifact to build
        required: true
        default: simulator
        type: choice
        options:
          - simulator
          - signed-ipa

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ROOT: Code/ATekWebCommon/ServerApplicationMobile
  APP_PROJECT: Code/ATekWebCommon/ServerApplicationMobile/ServerApplicationMobile/ServerApplicationMobile.csproj
  IOS_FRAMEWORK: net10.0-ios

jobs:
  simulator:
    name: iOS Simulator
    if: github.event_name != 'workflow_dispatch' || inputs.build_type == 'simulator'
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      # The paths below reproduce the source-tree layout used by the existing
      # ProjectReference entries in ServerApplicationMobile.csproj.
      - name: Check out the mobile app
        uses: actions/checkout@v7
        with:
          path: Code/ATekWebCommon/ServerApplicationMobile
          persist-credentials: false

      - name: Check out ATekCommon
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.ATEK_COMMON_REPOSITORY || format('{0}/ATekCommon', github.repository_owner) }}
          token: ${{ secrets.ATEK_COMMON_TOKEN || github.token }}
          path: Code/ATekCommon
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: Code/ATekWebCommon/ServerApplicationMobile/global.json
          workloads: maui-ios

      - name: Select Xcode 26.3
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer

      - name: Show build environment
        run: |
          dotnet --info
          xcodebuild -version

      - name: Restore iOS dependencies
        run: dotnet restore "$APP_PROJECT" -p:TargetFramework="$IOS_FRAMEWORK" -p:RuntimeIdentifier=iossimulator-arm64

      - name: Build the iOS Simulator app
        run: >-
          dotnet build "$APP_PROJECT"
          --framework "$IOS_FRAMEWORK"
          --configuration Release
          --no-restore
          -p:RuntimeIdentifier=iossimulator-arm64
          -p:ArchiveOnBuild=false

      - name: Package the Simulator app
        shell: bash
        run: |
          app_path="$(find "$APP_ROOT/ServerApplicationMobile/bin/Release/$IOS_FRAMEWORK/iossimulator-arm64" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "::error::The iOS Simulator .app bundle was not produced."
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app_path" ServerApplicationMobile-iOS-Simulator.zip

      - name: Upload the Simulator artifact
        uses: actions/upload-artifact@v7
        with:
          name: ServerApplicationMobile-iOS-Simulator
          path: ServerApplicationMobile-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14

  signed-ipa:
    name: Signed iOS IPA
    if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'signed-ipa'
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out the mobile app
        uses: actions/checkout@v7
        with:
          path: Code/ATekWebCommon/ServerApplicationMobile
          persist-credentials: false

      - name: Check out ATekCommon
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.ATEK_COMMON_REPOSITORY || format('{0}/ATekCommon', github.repository_owner) }}
          token: ${{ secrets.ATEK_COMMON_TOKEN || github.token }}
          path: Code/ATekCommon
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: Code/ATekWebCommon/ServerApplicationMobile/global.json
          workloads: maui-ios

      - name: Select Xcode 26.3
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer

      - name: Validate signing secrets
        shell: bash
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          missing=0
          for name in IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required repository secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install Apple signing certificate and provisioning profile
        id: signing
        shell: bash
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          certificate_path="$RUNNER_TEMP/ios-distribution.p12"
          profile_path="$RUNNER_TEMP/profile.mobileprovision"
          profile_plist="$RUNNER_TEMP/profile.plist"
          keychain_path="$RUNNER_TEMP/ios-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"

          codesign_key="$(security find-identity -v -p codesigning "$keychain_path" | awk -F\" '/[0-9A-F]{40}/ { print $2; exit }')"
          if [[ -z "$codesign_key" || -z "$profile_name" ]]; then
            echo "::error::Could not determine the signing identity or provisioning profile name."
            exit 1
          fi

          echo "codesign_key=$codesign_key" >> "$GITHUB_OUTPUT"
          echo "profile_name=$profile_name" >> "$GITHUB_OUTPUT"
          echo "keychain_path=$keychain_path" >> "$GITHUB_OUTPUT"
          echo "profile_uuid=$profile_uuid" >> "$GITHUB_OUTPUT"

      - name: Restore iOS dependencies
        run: dotnet restore "$APP_PROJECT" -p:TargetFramework="$IOS_FRAMEWORK" -p:RuntimeIdentifier=ios-arm64

      - name: Build the signed IPA
        env:
          CODESIGN_KEY: ${{ steps.signing.outputs.codesign_key }}
          PROVISIONING_PROFILE: ${{ steps.signing.outputs.profile_name }}
        run: >-
          dotnet publish "$APP_PROJECT"
          --framework "$IOS_FRAMEWORK"
          --configuration Release
          --no-restore
          -p:RuntimeIdentifier=ios-arm64
          -p:ArchiveOnBuild=true
          -p:BuildIpa=true
          -p:CodesignKey="$CODESIGN_KEY"
          -p:CodesignProvision="$PROVISIONING_PROFILE"

      - name: Upload the signed IPA
        uses: actions/upload-artifact@v7
        with:
          name: ServerApplicationMobile-iOS-IPA
          path: ${{ env.APP_ROOT }}/ServerApplicationMobile/bin/Release/${{ env.IOS_FRAMEWORK }}/ios-arm64/**/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing material
        if: always()
        shell: bash
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          if [[ -n "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          if [[ -n "$PROFILE_UUID" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
